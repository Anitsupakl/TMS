services:
  flask-app:
    build: .
    container_name: flask-app
    environment:
      REDIS_HOST: redis
    ports:
     - 5000:5000
    restart: always
    volumes:
      - ./app.py:/app/app.py
  redis:
    image: redis
    container_name: redis_flask
    restart: always
    ports:
      - 6379:6379
