services:
  memcached_node:
    image: memcached
    container_name: memcached_node
    environment:
      MEMCACHED_HOST: memcached:11211
    restart: always
    ports:
      - 11211:11211


  node-app:
    build: .
    container_name: node_app
    ports:
      - 3000:3000
    restart: always 
  
  proxy:
    image: nginx
    ports:
      - 8080:80
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
