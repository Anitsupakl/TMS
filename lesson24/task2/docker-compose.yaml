services:
  app_py:
    build: .
    container_name: app
    environment:
      MONGO_URI: mongodb://mongodb:27017/autoshop
    ports:
      - 5000:5000
    depends_on:
      - mongodb

  mongodb:
    image: mongo
    container_name: mongodb
    ports:
     - 27017:27017
#    healthcheck:
#      test: echo 'db.runCommand("ping").ok' | mongo mongodb:27017/autoshop --quiet
