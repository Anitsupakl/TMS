services:
  auth_app:
    container_name: auth_app
    build:
      context: ./log-app/auth
    ports:
      - 8081:8080

  pay_app:
    container_name: pay_app
    build:
      context: ./log-app/pay
    ports:
      - 8082:8080

  nginx:
    container_name: nginx
    build:
      context: ./log-app/nginx
    ports:
      - 8080:80
    volumes:
      - ./log-app/nginx/app.conf:/etc/nginx/conf.d/default.conf
    depends_on:
     -  auth_app
     -  pay_app
